name: macOS Node.js Environment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-node:
    runs-on: macos-26-intel

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.23.5'
          - '24.22.3'
          - '26.13.1'

    name: macOS / Node ${{ matrix.node-version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Record environment
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Architecture ==="
          uname -m

          echo "=== Node.js ==="
          node --version
          node -p "process.platform + ' ' + process.arch"
          command -v node

          echo "=== npm ==="
          npm --version
